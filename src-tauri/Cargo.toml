[package]
name = "amanite"
version = "0.3.0"
description = "A desktop editor for Fractal projects"
authors = ["Amanite contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "amanite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
dotenvy = "0.15"
fractal = { git = "https://github.com/AlbinDalbert/fractal", branch = "main", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
