[package]
name = "amanite"
version = "0.1.0"
description = "A desktop editor for Fractal projects"
authors = ["Amanite contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "amanite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fractal = { git = "https://github.com/AlbinDalbert/fractal", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
